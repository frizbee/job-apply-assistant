# ---------------------------------------------------------------
# LinkedIn Easy Apply ayarları. Her şeyi buradan değiştirebilirsin.
# CV analizi onaylanırsa pozisyonlar, başlık filtresi ve
# profil bilgileri CV'den gelen değerlerle değiştirilir (bu dosya değişmez).
# ---------------------------------------------------------------

# LLM profiles: only OpenRouter free_auto is implemented at this stage.
# Native/explicit profiles are configuration placeholders; choose a model later.
# API keys belong in .env, never here. paid_allowed is NOT payment consent.
llm:
  default_profile: free
  profiles:
    free:
      provider: openrouter
      selection: free_auto
      model: null
      cost_policy: free_only
      max_output_tokens: 4096
      timeout_seconds: 180
    openai:
      provider: openai
      selection: explicit
      model: null
      cost_policy: paid_allowed
      max_output_tokens: 4096
      timeout_seconds: 180
    claude:
      provider: anthropic
      selection: explicit
      model: null
      cost_policy: paid_allowed
      max_output_tokens: 4096
      timeout_seconds: 180

search:
  # Arayüzde/CV'den gelen pozisyonlar bunun yerine kullanılır
  keywords:
    - "Software Engineer"
  locations:
    - "European Union"
    - "United Kingdom"
    - "United States"
  remote_only: true            # sadece remote ilanlar (f_WT=2)
  posted_within_hours: 168     # son 1 haftada yayınlanan ilanlar
  experience_levels: [2, 3, 4] # 2=Entry 3=Associate 4=Mid-Senior 5=Director
  pages_per_search: 2          # her arama için kaç sayfa (25 ilan/sayfa)
  # Remote panolarda konum kısıtı olan ilanlar bunlardan birine uymalı (regex); ülke de kabul edilir
  accepted_regions: 'anywhere|worldwide|global|europe|emea|\beu\b|cet'

filters:
  # Başlık bunlardan en az birine uymalı (regex, küçük harf)
  title_include:
    - '\bai\b|a\.i\.|artificial intelligence'
    - 'machine learning|\bml\b|mlops|deep learning|computer vision|\bcv\b'
    - '\bllm|gen ?ai|generative|\bnlp\b|prompt|agent|\brag\b|chatbot|conversational'
    - 'data|analyst|analytics|scien|research'
    - 'python|backend|back-end|software|developer|engineer|automation|platform|cloud|api'
    - 'yapay zeka|veri|yazılım|mühendis|geliştirici|analist|otomasyon'
  # Başlıkta bunlar varsa atla
  title_exclude:
    - 'intern|internship|stajyer|werkstudent|praktikum|trainee'
  # İlan metninde bunlar varsa atla (ör. yerel dil şartı)
  description_exclude:
    - 'fluent (in )?(german|french|dutch|spanish|italian|polish)'
    - '(german|french|dutch)[- ]speaking'
    - 'security clearance'
    - 'us citizens? only'
  exclude_companies: []

# İlan kaynakları. LinkedIn/Wellfound/Indeed kendi hızlı başvurusunu kullanır (ilk seferde
# açılan pencerede giriş yapılır). Remote OK/Himalayas/We Work Remotely ilanları şirket
# sitesindeki forma gider (aşağıdaki external ayarları geçerli).
sources:
  linkedin: true
  wellfound: true
  indeed: true
  indeed_domain: "www.indeed.com"
  indeed_easy_apply_only: false   # true: sadece "Easily apply" ilanları
  remoteok: true
  himalayas: true
  weworkremotely: true

# Şirket sitesindeki formlar (Greenhouse, Lever, Ashby otomatik; diğerleri
# data/manual_apply.csv'ye yazılır). Spam sayılmamak için az ve aralıklı.
external:
  enabled: true
  max_per_run: 5            # çalıştırma başına en fazla şirket formu
  min_wait_seconds: 180     # iki şirket formu arası bekleme

limits:
  max_applications_per_run: 40   # tüm kaynaklar: Submit denemeleri (belirsiz/reddedilen dahil); test modunda önizlemeler
  per_source: 15                 # tek kaynak için aynı deneme/önizleme sınırı; ATS kaynak platforma sayılır
  max_runtime_minutes: 90

# Kişisel bilgiler arayüzden / CV'den doldurulur; burada sadece varsayılanlar var.
profile:
  first_name: ""
  last_name: ""
  full_name: ""
  email: ""
  phone: ""
  phone_intl: ""
  current_company: ""          # dış formlarda "şu anki şirket" alanı (boşsa doldurulmaz)
  current_title: ""
  city: ""
  country: ""
  linkedin: ""
  github: ""
  resume_file: ""
  cover_letter: ""

# User-confirmed years only (regex skill name -> nonnegative number).
# CV estimates are not automatically trusted. Example: python: 3
skill_years: {}

# Only answers explicitly confirmed by the user, keyed by the complete question.
# Example: "Will you require visa sponsorship?": "Yes"
# No answers are inferred from residence, remote work, or the CV for legal questions.
confirmed_answers: {}

# Form soruları için kurallar. Soru metni (küçük harf) "match" regex'ine uyarsa
# "answer" kullanılır. Liste verirsen seçenekli sorularda sırayla denenir.
# Sıra önemli: ilk eşleşen kazanır. Bilinmeyen sorular manuel incelemeye gider.
# Vize, çalışma izni, eğitim, diğer diller ve hukuki onaylar için varsayılan yoktur.
# Hassas soruların tam metni için yukarıdaki confirmed_answers alanını kullanın.
answers:
  - match: 'country code|ülke.*kodu'
    answer: "__COUNTRY_CODE__"   # telefondan, ör. "(+90)"
  - match: 'phone|mobile|telefon'
    answer: "__PHONE__"
  - match: 'english|angielski|englisch|anglais|inglés|ingilizce'
    answer: "__ENGLISH__"      # başlangıçta sorulan seviye
  - match: 'salary|compensation|ücret|maaş|\brate\b|hourly'
    answer: "__SALARY__"       # başlangıçta sorulan yıllık beklenti
  - match: 'notice period|ihbar'
    answer: "__NOTICE__"
  - match: 'gender|race|ethnic|veteran|disabilit|pronoun|sexual orientation'
    answer: ["Decline to self-identify", "I don't wish to answer", "Prefer not to say", "Decline", "I do not want to answer"]
  - match: 'linkedin'
    answer: "__LINKEDIN__"
  - match: 'github|portfolio|website|personal site'
    answer: "__GITHUB__"
  - match: 'country.*(located|live|reside|based)|which country|country of residence'
    answer: "__COUNTRY__"
  - match: '\bcity\b|location|şehir|where are you (based|located)'
    answer: "__CITY__"
  - match: '^cover letter\b|^message to the hiring (team|manager)\b'
    answer: "__COVER_LETTER__"

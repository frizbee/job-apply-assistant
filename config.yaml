# ---------------------------------------------------------------
# Job application settings and defaults.
# A reviewed CV profile overrides job titles, title filters and personal details
# in memory; this configuration file is not changed.
# ---------------------------------------------------------------

# LLM profiles: only OpenRouter free_auto is implemented at this stage.
# Native/explicit profiles are configuration placeholders; choose a model later.
# API keys belong in .env, never here. paid_allowed is NOT payment consent.
llm:
  default_profile: free
  profiles:
    free:
      provider: openrouter
      selection: free_auto
      model: null
      cost_policy: free_only
      max_output_tokens: 4096
      timeout_seconds: 180
    openai:
      provider: openai
      selection: explicit
      model: null
      cost_policy: paid_allowed
      max_output_tokens: 4096
      timeout_seconds: 180
    claude:
      provider: anthropic
      selection: explicit
      model: null
      cost_policy: paid_allowed
      max_output_tokens: 4096
      timeout_seconds: 180

search:
  # Job titles from the GUI/reviewed CV override these defaults.
  keywords:
    - "Software Engineer"
  locations:
    - "European Union"
    - "United Kingdom"
    - "United States"
  remote_only: true            # Remote jobs only (f_WT=2).
  posted_within_hours: 168     # Jobs posted in the last week.
  experience_levels: [2, 3, 4] # 2=Entry 3=Associate 4=Mid-Senior 5=Director
  pages_per_search: 2          # Pages per search (25 jobs/page).
  # Restricted locations must match this pattern or the profile's country.
  accepted_regions: 'anywhere|worldwide|global|europe|emea|\beu\b|cet'

filters:
  # Job titles must match at least one pattern (lowercase regex).
  title_include:
    - '\bai\b|a\.i\.|artificial intelligence'
    - 'machine learning|\bml\b|mlops|deep learning|computer vision|\bcv\b'
    - '\bllm|gen ?ai|generative|\bnlp\b|prompt|agent|\brag\b|chatbot|conversational'
    - 'data|analyst|analytics|scien|research'
    - 'python|backend|back-end|software|developer|engineer|automation|platform|cloud|api'
    - 'yapay zeka|veri|yazılım|mühendis|geliştirici|analist|otomasyon'
  # Skip titles matching these patterns.
  title_exclude:
    - 'intern|internship|stajyer|werkstudent|praktikum|trainee'
  # Skip descriptions matching these patterns (e.g. local language requirements).
  description_exclude:
    - 'fluent (in )?(german|french|dutch|spanish|italian|polish)'
    - '(german|french|dutch)[- ]speaking'
    - 'security clearance'
    - 'us citizens? only'
  exclude_companies: []

# LinkedIn/Wellfound/Indeed use their own application flows; sign in manually.
# Remote OK/Himalayas/We Work Remotely link to company forms, subject to the
# external settings below.
sources:
  linkedin: true
  wellfound: true
  indeed: true
  indeed_domain: "www.indeed.com"
  indeed_easy_apply_only: false   # true: only "Easily apply" jobs.
  remoteok: true
  himalayas: true
  weworkremotely: true

# Approved company forms (Greenhouse, Lever, Ashby); other sites are recorded
# in data/manual_apply.csv. Limit attempts and leave time between them.
external:
  enabled: true
  max_per_run: 5            # Maximum company forms per run.
  min_wait_seconds: 180     # Cooldown between company forms.

limits:
  max_applications_per_run: 40   # Submit attempts, including uncertain/rejected; previews in test mode.
  per_source: 15                 # Per-board attempt/preview cap; ATS forms count toward their source board.
  max_runtime_minutes: 90

# Personal details are supplied through the GUI/reviewed CV; these are defaults.
profile:
  first_name: ""
  last_name: ""
  full_name: ""
  email: ""
  phone: ""
  phone_intl: ""
  current_company: ""          # External "current company" field; not filled if unknown.
  current_title: ""
  city: ""
  country: ""
  linkedin: ""
  github: ""
  resume_file: ""
  cover_letter: ""

# User-confirmed years only (regex skill name -> nonnegative number).
# CV estimates are not automatically trusted. Example: python: 3
skill_years: {}

# Only answers explicitly confirmed by the user, keyed by the complete question.
# Example: "Will you require visa sponsorship?": "Yes"
# No answers are inferred from residence, remote work, or the CV for legal questions.
confirmed_answers: {}

# Form-answer rules match lowercase question text. The first matching rule wins.
# Lists provide candidate answers for single-choice questions and complete sets
# for checkbox groups. Unknown questions require manual review.
# No defaults for visas, work authorization, education, other languages or legal consent.
# Use exact question-specific confirmed_answers above for sensitive questions.
answers:
  - match: 'country code|ülke.*kodu'
    answer: "__COUNTRY_CODE__"   # Derived from the phone, e.g. "(+90)".
  - match: 'phone|mobile|telefon'
    answer: "__PHONE__"
  - match: 'english|angielski|englisch|anglais|inglés|ingilizce'
    answer: "__ENGLISH__"      # User-selected English level.
  - match: 'salary|compensation|ücret|maaş|\brate\b|hourly'
    answer: "__SALARY__"       # Explicit salary expectations, converted only with known units.
  - match: 'notice period|ihbar'
    answer: "__NOTICE__"
  - match: 'gender|race|ethnic|veteran|disabilit|pronoun|sexual orientation'
    answer: ["Decline to self-identify", "I don't wish to answer", "Prefer not to say", "Decline", "I do not want to answer"]
  - match: 'linkedin'
    answer: "__LINKEDIN__"
  - match: 'github|portfolio|website|personal site'
    answer: "__GITHUB__"
  - match: 'country.*(located|live|reside|based)|which country|country of residence'
    answer: "__COUNTRY__"
  - match: '\bcity\b|location|şehir|where are you (based|located)'
    answer: "__CITY__"
  - match: '^cover letter\b|^message to the hiring (team|manager)\b'
    answer: "__COVER_LETTER__"

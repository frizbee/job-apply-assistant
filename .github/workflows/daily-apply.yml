name: LinkedIn Auto Apply

on:
  schedule:
    - cron: "0 9 * * *"   # her gün 12:00 Türkiye saati (09:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test modu: formları doldur ama gönderme"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: linkedin-apply

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Apply
        env:
          LI_AT: ${{ secrets.LI_AT }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: python apply.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Apply run $(date -u +%F)"
          git push
